<form [formGroup]="form" (ngSubmit)="crearViaje()" class="max-w-sm mx-auto">
    <div class="mb-5">
        <label for="destino" class="block mb-2.5 text-sm font-medium text-heading">Destino</label>
        <input formControlName="destino" type="text" id="destino" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Destino del viaje" required />
    </div>
    <div class="mb-5">
        <label for="descripcion" class="block mb-2.5 text-sm font-medium text-heading">Descripción</label>
        <textarea formControlName="descripcion" id="descripcion" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Descripción del viaje" required></textarea>
    </div>
    <div class="mb-5">
        <label for="fecha" class="block mb-2.5 text-sm font-medium text-heading">Fecha</label>
        <input formControlName="fecha" type="date" id="fecha" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" required />
    </div>
    <div class="mb-5">
        <label for="dias" class="block mb-2.5 text-sm font-medium text-heading">Días</label>
        <input formControlName="dias" type="number" id="dias" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Cantidad de días del viaje" required />
    </div>
    <div class="mb-5">
        <label for="imagen" class="block mb-2.5 text-sm font-medium text-heading">Imagen</label>
        <input formControlName="imagen" type="file" id="imagen" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" required />
    </div>
    <button 
        type="submit" 
        [disabled]="!form.valid"
        class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none disabled:opacity-50">
        Crear viaje
    </button>
</form>

@if (showModal()) {
  <!-- Se eliminó 'hidden' y se cambiaron las clases para centrar el modal en pantalla mediante un backdrop -->
  <div tabindex="-1" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-xs p-4">
      <div class="relative w-full max-w-md max-h-full">
          <div class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6">
                  <!-- Se asignó una función para cerrar el modal mutando la señal o variable -->
                  <button (click)="cerrarModal()" type="button" class="absolute top-3 end-2.5 text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center">
                      <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                      <span class="sr-only">Close modal</span>
                  </button>
              <div class="p-4 md:p-5 text-center">
                  <svg class="mx-auto mb-4 text-fg-disabled w-12 h-12" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 13V8m0 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                  <h3 class="mb-6 text-body font-medium">Viaje creado exitosamente</h3>
              </div>
          </div>
      </div>
  </div>
}
