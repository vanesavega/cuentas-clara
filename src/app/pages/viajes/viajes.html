@if (viajes.length === 0) {
  <div class="justify-center items-center flex flex-col h-full bg-neutral-primary-soft p-6 border border-default rounded-base shadow-xs"> 
    <p class="text-2xl font-semibold tracking-tight text-heading">
        No hay viajes disponibles
    </p>
    <div class="flex justify-center mt-8">
        <button
            routerLink="/nuevo-viaje" 
            class="bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
            Crear nuevo viaje
        </button>
    </div>
  </div>
} @else {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
    @for (viaje of viajes; track viaje.id) {
      <app-card-viaje [viaje]="viaje"></app-card-viaje>
    }
  </div>
}
